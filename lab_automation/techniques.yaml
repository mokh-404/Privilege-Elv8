              $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('& C:\Users\Public\ps_task_v1.ps1'))
              Start-Process -FilePath "powershell.exe" -ArgumentList @("-NoProfile", "-WindowStyle", "Hidden", "-EncodedCommand", $enc) -WindowStyle Hidden

      - variant: 2
        verify_hint: "PowerShell FromBase64String loader executing staged script in ProgramData"
        expected_artifact_keys:
          - "file|c:\\programdata\\ps_stage_v2.ps1|ps_stage_v2.ps1"
